name: macOS spike

# Does Chummer run on macOS under Mono? See docs/LINUX-MACOS.md.
# - push trigger: workflow_dispatch only lists workflows already on main
on:
  push:
    branches: [spike/mono-linux-macos]
  workflow_dispatch:
    inputs:
      mono_pkg_url:
        description: Mono installer (.pkg), used when Homebrew has no mono
        default: https://download.mono-project.com/archive/6.12.0/macos-10-universal/MonoFramework-MDK-6.12.0.206.macos10.xamarin.universal.pkg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The image's Debian sources are archived, but the build needs nothing from apt.
      - name: Build with Mono MSBuild
        run: >
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/src" -w /src mono:6.12
          msbuild Chummer/Chummer.csproj -restore -p:Configuration=Debug -p:Platform=x86 -v:m -nologo

      - name: Add test characters
        run: |
          cp "tests/fixtures/characters/examples/Combat Mage.chum" Chummer/bin/Debug/create.chum
          cp "tests/fixtures/characters/10 Mercs/Team Zero/Team Zero Operator.chum" Chummer/bin/Debug/career.chum

      - uses: actions/upload-artifact@v4
        with:
          name: chummer-mono
          path: Chummer/bin/Debug

  run:
    needs: build
    name: run (${{ matrix.driver }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [native, x11]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chummer-mono
          path: app

      - name: Install Mono
        env:
          MONO_PKG_URL: ${{ inputs.mono_pkg_url || 'https://download.mono-project.com/archive/6.12.0/macos-10-universal/MonoFramework-MDK-6.12.0.206.macos10.xamarin.universal.pkg' }}
        run: |
          if brew install mono mono-libgdiplus; then
            echo "Mono from Homebrew"
          else
            curl -sSL -o mono.pkg "$MONO_PKG_URL"
            sudo installer -pkg mono.pkg -target /
            echo "/Library/Frameworks/Mono.framework/Versions/Current/Commands" >> "$GITHUB_PATH"
          fi

      - name: Install XQuartz
        if: matrix.driver == 'x11'
        run: |
          brew install --cask xquartz
          echo "/opt/X11/bin" >> "$GITHUB_PATH"

      # - Homebrew builds libgdiplus --without-x11: Mono's X11 driver needs its X11 calls
      - name: Build libgdiplus with X11
        if: matrix.driver == 'x11'
        run: |
          brew install pkgconf libx11
          curl -sSL https://dl.winehq.org/mono/sources/libgdiplus/libgdiplus-6.2.tar.gz | tar xz
          cd libgdiplus-6.2
          ./configure --prefix="$HOME/gdiplus-x11" > ../configure.log 2>&1 || { tail -50 ../configure.log; exit 1; }
          grep -q "X11 = yes" ../configure.log || { tail -30 ../configure.log; exit 1; }
          make -j"$(sysctl -n hw.ncpu)" > ../make.log 2>&1 || { tail -50 ../make.log; exit 1; }
          make install > /dev/null
          nm -gU "$HOME/gdiplus-x11/lib/libgdiplus.dylib" | grep GdipCreateFromXDrawable_linux

      - name: Start Chummer and take screenshots
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          set -u
          mkdir -p out
          uname -a > out/system.txt
          sw_vers >> out/system.txt
          mono --version >> out/system.txt 2>&1 || echo "mono not found" >> out/system.txt

          # - Homebrew's libgdiplus and XQuartz's libX11 are not on Mono's search path
          # - exported here: SIP strips DYLD_ variables from a step env before bash starts
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib:/opt/X11/lib:/usr/local/lib:/usr/lib"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$DYLD_FALLBACK_LIBRARY_PATH" >> out/system.txt
          ls "$(brew --prefix)/lib" /opt/X11/lib 2>/dev/null | grep -E "libgdiplus|libX11\." >> out/system.txt || true

          if [ "$DRIVER" = x11 ]; then
            # The X11 build of libgdiplus wins over Homebrew's.
            export DYLD_LIBRARY_PATH="$HOME/gdiplus-x11/lib"
            Xvfb :99 -screen 0 1600x1000x24 > out/xvfb.log 2>&1 &
            export DISPLAY=:99 MONO_MWF_MAC_FORCE_X11=1
            sleep 3
          fi

          shot() {
            if [ "$DRIVER" = x11 ]; then
              xwd -root -silent -out "out/$1.xwd" || true
            else
              screencapture -x "out/$1.png" || true
            fi
          }

          status=0
          for c in create career; do
            (cd app && exec mono --debug Chummer.exe "$PWD/$c.chum") > "out/$c.log" 2>&1 &
            pid=$!
            sleep 45
            shot "$c"
            if kill -0 "$pid" 2>/dev/null; then
              echo "$c: running after 45 s" | tee -a out/result.txt
              kill "$pid" || true
            else
              echo "$c: exited early" | tee -a out/result.txt
              status=1
            fi
            sleep 2
          done
          exit $status

      # - own step: a missing ImageMagick costs only the PNGs
      - name: Convert X11 screenshots
        if: always() && matrix.driver == 'x11'
        run: |
          brew install imagemagick || exit 0
          for f in out/*.xwd; do [ -e "$f" ] && { magick "xwd:$f" "${f%.xwd}.png" || true; }; done; true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-results-${{ matrix.driver }}
          path: out
